<!-- feedback form - Google forms -->
<!-- v0.1, 2021-01-09 -->

{% for feedbackEntry in site.data.features.feedback %}
  {% if feedbackEntry.active %}
    {% if feedbackEntry.type == 'googleform' %}
    <script type="text/javascript" src="{{site.data.info.assets | escape}}assets/js/feedback.js"></script>
    {% endif %}
  {% endif %}

{% endfor %}

<!-- / feedback form  -->
